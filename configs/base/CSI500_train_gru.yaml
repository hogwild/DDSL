dataset:
  name: CSI500
  market: cn
  adjust: hfq

  # These are placeholders.
  # They will be overridden by --dataset / --iteration / --output_root.
  train_parquet: outputs/CSI50050/iter_0/dataset/train/ALL_tokens_hfq.parquet
  val_parquet: outputs/CSI500/iter_0/dataset/val/ALL_tokens_hfq.parquet

model:
  # num_K/Q/G/M must match the CSI500 codebook exactly -- same values as
  # configs/base/CSI500_train.yaml (the Transformer config for this dataset).
  num_K: 16
  num_Q: 8
  num_G: 8
  num_M: 4

  d_model: 64
  hidden_size: 64
  num_layers: 2
  dropout: 0.3
  bidirectional: false
  pooling: last  # options: {"last", "mean"}

training:
  seed: 42
  seq_len: 60
  batch_size: 2048
  num_workers: 8
  epochs: 60
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  scheduler: ReduceLROnPlateau

  loss_type: focal
  use_class_weights: true

loss:
  focal_gamma: 2.0

output:
  out_dir: outputs/CSI500/iter_0/model_gru/seed_42