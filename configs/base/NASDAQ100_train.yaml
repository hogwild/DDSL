dataset:
  name: NASDAQ100
  market: us
  adjust: hfq

  # These are placeholders.
  # They will be overridden by --dataset / --iteration / --output_root.
  train_parquet: outputs/NASDAQ100/iter_0/dataset/train/ALL_tokens_hfq.parquet
  val_parquet: outputs/NASDAQ100/iter_0/dataset/val/ALL_tokens_hfq.parquet

model:
  num_K: 16
  num_Q: 8
  num_G: 8
  num_M: 4

  d_model: 64
  nhead: 4
  num_layers: 6
  dim_feedforward: 128
  dropout: 0.3
  max_seq_len: 60
  pooling: last # options: {"last", "mean", "cls"}

training:
  seed: 42
  seq_len: 60
  batch_size: 2048
  num_workers: 8
  epochs: 60
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  scheduler: ReduceLROnPlateau

  loss_type: focal
  use_class_weights: true

loss:
  focal_gamma: 2.0

output:
  # In pipeline mode (--iteration supplied), out_dir is automatically overridden with
  # outputs/{dataset}/iter_{k}/model/seed_{seed}
  # Applies only to direct run_train_transformer.py calls without --iteration.
  out_dir: outputs/NASDAQ100/iter_0/model/seed_42